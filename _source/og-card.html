<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social share card</title>
<!-- Source for images/web/og-card.jpg (1200x630). Screenshot at exactly 1200x630 with headless Chrome. -->
<link rel="stylesheet" href="https://use.typekit.net/piz5gep.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0f3325}
.card{position:relative;width:1200px;height:630px;font-family:'Inter',sans-serif;color:#fbfaf4}
.photo{position:absolute;inset:0;background:url('../images/web/hero-1680.jpg') 62% 24%/cover no-repeat}
.photo::after{content:'';position:absolute;inset:0;background:
  linear-gradient(0deg,rgba(15,51,37,.9) 0%,rgba(15,51,37,0) 40%),
  linear-gradient(95deg,rgba(15,51,37,.98) 0%,rgba(15,51,37,.9) 40%,rgba(29,92,68,.25) 78%,rgba(29,92,68,.45) 100%)}
.content{position:absolute;left:72px;top:80px;right:420px}
.eyebrow{font-family:'abolition','Arial Narrow',sans-serif;font-weight:400;font-size:30px;letter-spacing:.1em;text-transform:uppercase;color:#f2c75c}
h1{margin:10px 0 24px;font-family:'abolition','Arial Narrow',sans-serif;font-weight:400;text-transform:uppercase;font-size:170px;line-height:.86;letter-spacing:.02em;color:#fff}
h1 span{color:#f2c75c}
ul{list-style:none;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:14px;font-weight:600;font-size:27px;line-height:1.2}
li::before{content:'';flex:none;width:11px;height:11px;border-radius:50%;background:#f2c75c}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#bd8b13}
</style>
</head>
<body>
<div class="card">
  <div class="photo"></div>
  <div class="content">
    <p class="eyebrow">Head Wrestling Coach · Cal Poly</p>
    <h1>Jon<br><span>Sioredas</span></h1>
    <ul>
      <li>Two-Time Pac-12 Coach of the Year</li>
      <li>President, National Wrestling Coaches Association</li>
    </ul>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
