<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social share card</title>
<!-- Source for images/web/og-card.jpg (1200x630). Screenshot at exactly 1200x630 with headless Chrome. -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#092018}
.card{position:relative;width:1200px;height:630px;font-family:'Source Sans 3',sans-serif;color:#F4F2EC}
.photo{position:absolute;inset:0;background:url('../images/web/hero-1680.jpg') 62% 24%/cover no-repeat}
.photo::after{content:'';position:absolute;inset:0;background:
  linear-gradient(0deg,rgba(9,32,24,.9) 0%,rgba(9,32,24,0) 40%),
  linear-gradient(95deg,rgba(9,32,24,.98) 0%,rgba(9,32,24,.9) 40%,rgba(9,32,24,.2) 78%,rgba(9,32,24,.4) 100%)}
.content{position:absolute;left:72px;top:92px;right:420px}
.eyebrow{display:flex;align-items:center;gap:14px;font-weight:700;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#C6A14B}
.eyebrow::before{content:'';width:40px;height:3px;background:#C6A14B}
h1{margin:18px 0 22px;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:150px;line-height:.86;letter-spacing:.015em;color:#fff}
h1 span{color:#C6A14B}
ul{list-style:none;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:14px;font-weight:600;font-size:27px;line-height:1.2}
li::before{content:'';flex:none;width:9px;height:9px;background:#C6A14B;transform:rotate(45deg)}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#C6A14B}
</style>
</head>
<body>
<div class="card">
  <div class="photo"></div>
  <div class="content">
    <p class="eyebrow">Head Wrestling Coach · Cal Poly</p>
    <h1>Jon<br><span>Sioredas</span></h1>
    <ul>
      <li>Two-Time Pac-12 Coach of the Year</li>
      <li>President, National Wrestling Coaches Association</li>
    </ul>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
