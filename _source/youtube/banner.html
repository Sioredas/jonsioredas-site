<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube channel banner — Jon Sioredas</title>
<!--
  Source for out/youtube-banner.png  (2560 x 1440)
  YouTube channel art spec:
    upload canvas ......... 2560 x 1440 (max 6 MB)
    TV / full bleed ....... 2560 x 1440
    desktop strip ......... 2560 x 423   (the band at y 508.5 - 931.5)
    SAFE AREA (all sizes) . 1546 x 423   (x 507 - 2053, y 508.5 - 931.5)
  Nearly everyone sees only the band, and phones see only the safe area, so the
  whole design lives in the band and every word lives inside the safe area.
  Add #guides to the URL to overlay the safe-area rectangles.
-->
<link rel="stylesheet" href="https://use.typekit.net/piz5gep.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_brand.css">
<style>
html,body{width:2560px;height:1440px;overflow:hidden}
.canvas{position:relative;width:2560px;height:1440px;color:var(--cream);
  background:
    radial-gradient(1500px 1000px at 26% 50%,rgba(29,92,68,.50) 0%,rgba(15,51,37,0) 70%),
    var(--green-deep)}

/* ---- the band: 2560 x 423, everything visible on desktop -------------- */
.band{position:absolute;left:0;top:508px;width:2560px;height:424px;overflow:hidden}

/* action crop, sized so his head and the pointing arm fill the band.
   source hero-coaching.jpg is 2000x1600; we map source x 700-1450 / y 200-500
   onto the 1060 x 424 photo panel (scale 1.413), shifted so his face clears the
   right edge of the safe area by ~195px on a narrow desktop window.
   The photo carries the filter; the feather is a SIBLING so the filter cannot
   shift its green away from the canvas green and leave a seam. */
.panel{position:absolute;right:0;top:0;width:1060px;height:424px;
  background:url('../../images/hero-coaching.jpg') no-repeat;
  background-size:2827px 2261px;background-position:-1069px -289px;
  filter:saturate(.95) contrast(1.06)}
.feather{position:absolute;right:0;top:0;width:1060px;height:424px;z-index:2;background:
  linear-gradient(90deg,var(--green-deep) 0%,var(--green-deep) 6%,rgba(15,51,37,.94) 18%,rgba(15,51,37,.58) 34%,rgba(15,51,37,.16) 56%,rgba(15,51,37,.08) 100%)}
/* the top/bottom shade has to run the FULL width of the band — clipped to the
   photo panel it steps at the panel edge and shows as a vertical seam */
.bandshade{position:absolute;inset:0;z-index:2;pointer-events:none;background:
  linear-gradient(180deg,rgba(15,51,37,.42) 0%,rgba(15,51,37,0) 22%,rgba(15,51,37,0) 76%,rgba(15,51,37,.42) 100%)}

/* gold hairlines top and bottom of the band */
.band::before,.band::after{content:'';position:absolute;left:0;right:0;height:3px;z-index:3;
  background:linear-gradient(90deg,rgba(242,199,92,0) 0%,rgba(242,199,92,.7) 18%,rgba(242,199,92,.7) 82%,rgba(242,199,92,0) 100%)}
.band::before{top:0}
.band::after{bottom:0}

/* ---- type lockup, inside the safe area -------------------------------- */
.lockup{position:absolute;left:547px;top:508px;width:940px;height:424px;z-index:4;
  display:flex;flex-direction:column;justify-content:center}

.eyebrow{font-family:var(--head);font-size:31px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--gold);line-height:1;white-space:nowrap}
.eyebrow b{font-weight:400;color:rgba(242,199,92,.55);padding:0 12px}

h1{margin:22px 0 24px;font-family:var(--head);font-weight:400;text-transform:uppercase;
  font-size:112px;line-height:.85;letter-spacing:.012em;color:#fff;
  text-shadow:0 3px 30px rgba(15,51,37,.6)}
h1 span{color:var(--gold)}

.kicker{display:flex;align-items:center;gap:22px}
.tags{font-family:var(--body);font-weight:600;font-size:22px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--cream-dim);white-space:nowrap}
.tags i{font-style:normal;color:var(--gold-deep);padding:0 8px}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.url{font-family:var(--head);font-size:36px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gold);white-space:nowrap}

/* ---- guides ----------------------------------------------------------- */
.guide{display:none;position:absolute;z-index:9;border:2px dashed rgba(255,0,110,.95);
  font:600 20px var(--body);color:#ff006e}
.guide span{position:absolute;top:-30px;left:0;white-space:nowrap}
body.guides .guide{display:block}
</style>
</head>
<body>
<div class="canvas">
  <div class="band"><div class="panel"></div><div class="feather"></div><div class="bandshade"></div></div>

  <div class="lockup">
    <p class="eyebrow">Head Coach, Cal Poly Wrestling<b>&middot;</b>President, NWCA</p>
    <h1>Bring Top 25 NCAA<br><span>Division I training to you</span></h1>
    <div class="kicker">
      <p class="tags">Technique<i>&middot;</i>Drills<i>&middot;</i>Culture</p>
      <span class="dot"></span>
      <p class="url">jonsioredas.com</p>
    </div>
  </div>

  <div class="guide" style="left:507px;top:508px;width:1546px;height:424px"><span>SAFE 1546 × 423 — phone / all devices</span></div>
  <div class="guide" style="left:0;top:508px;width:2560px;height:424px;border-color:rgba(0,180,255,.95);color:#00b4ff"><span>DESKTOP STRIP 2560 × 423</span></div>
</div>
<script>if(location.hash==='#guides')document.body.classList.add('guides')</script>
</body>
</html>
