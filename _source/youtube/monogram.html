<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Logo mark — JS monogram</title>
<!-- Source for out/logo-monogram.png (800x800). The alternative avatar, and the
     mark used on thumbnails and the video watermark. -->
<link rel="stylesheet" href="https://use.typekit.net/piz5gep.css">
<link rel="stylesheet" href="_brand.css">
<style>
html,body{width:800px;height:800px;overflow:hidden;background:transparent}
.m{position:relative;width:800px;height:800px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 34%,var(--green-lift) 0%,var(--green-deep) 74%)}
.ring{position:absolute;inset:0;border-radius:50%;border:18px solid var(--gold);
  box-shadow:inset 0 0 0 5px rgba(15,51,37,.55)}
.js{position:absolute;left:0;right:0;top:50%;transform:translateY(-56%);
  text-align:center;font-family:var(--head);font-size:400px;line-height:.8;
  /* letter-spacing adds a trailing gap after the S, so pad the left to match
     and keep the pair optically centred in the circle */
  letter-spacing:.07em;padding-left:28px;color:var(--cream);text-transform:uppercase}
.js b{font-weight:400;color:var(--gold)}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:186px;
  width:268px;height:15px;background:var(--gold);border-radius:2px}
</style></head>
<body><div class="m"><div class="js">J<b>S</b></div><div class="bar"></div><div class="ring"></div></div></body></html>
